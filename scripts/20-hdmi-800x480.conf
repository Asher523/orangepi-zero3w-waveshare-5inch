# 这块屏的 HDMI 驱动能解析 EDID,但不把模式注册到 connector,
# 于是 Xorg 报 "Output HDMI-1 enabled but has no modes" -> no screens found。
# 这里直接给输出写死一条 Modeline,Xorg 不再依赖驱动的模式列表。
# 时序来自屏的真实 EDID: 800x480 @ 37.000 MHz (≈60.73 Hz)
Section "Monitor"
    Identifier     "HDMI-1"
    VendorName     "ADA"
    ModelName      "800x480 Panel"
    Option         "Enable" "true"
    Option         "PreferredMode" "800x480_60r"
    Modeline       "800x480_60r" 37.000 800 848 888 1088 480 483 493 560 -HSync -VSync
EndSection

Section "Device"
    Identifier     "modesetting"
    Driver         "modesetting"
EndSection
